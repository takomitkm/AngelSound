name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: build/Release/AngelSound.exe
            video: offscreen
          - os: macos-latest
            bin: build/AngelSound.app/Contents/MacOS/AngelSound
            video: dummy
          - os: ubuntu-latest
            bin: build/AngelSound
            video: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev libxtst-dev libxrender-dev \
            libasound2-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgbm-dev libdrm-dev

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DANGELSOUND_USE_SYSTEM_SDL3=OFF

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke
        shell: bash
        env:
          SDL_VIDEODRIVER: ${{ matrix.video }}
          SDL_AUDIODRIVER: dummy
          ANGELSOUND_BIN: ${{ matrix.bin }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export SDL_RENDER_DRIVER=software
          fi
          "$ANGELSOUND_BIN" --smoke

  android:
    name: android (assembleDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and platform
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AngelSound-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error