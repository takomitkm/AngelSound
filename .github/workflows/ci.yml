name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: build/Release/AngelSound.exe
            video: offscreen
          - os: macos-latest
            bin: build/AngelSound.app/Contents/MacOS/AngelSound
            video: dummy
          - os: ubuntu-latest
            bin: build/AngelSound
            video: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev libxtst-dev libxrender-dev \
            libasound2-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgbm-dev libdrm-dev

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DANGELSOUND_USE_SYSTEM_SDL3=OFF

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke
        shell: bash
        env:
          SDL_VIDEODRIVER: ${{ matrix.video }}
          SDL_AUDIODRIVER: dummy
          ANGELSOUND_BIN: ${{ matrix.bin }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export SDL_RENDER_DRIVER=software
          fi
          "$ANGELSOUND_BIN" --smoke

  android:
    name: android (assembleDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install NDK and platform
        shell: bash
        run: |
          SDK="$ANDROID_HOME"
          if [ -z "$SDK" ]; then SDK="$ANDROID_SDK_ROOT"; fi
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download SDL3 Android AAR
        shell: bash
        working-directory: android
        env:
          SDL3_AAR_VERSION: '3.4.20'
          SDL3_ZIP_SHA256: '535320e58f3bd7235b3e15f940595cdeeb9b8c0aa6b3810ff127345e3567d4da'
          SDL3_AAR_SHA256: 'e5eec5e3d0293cbe9ce5899d451eaaf00a5c9ed70c1e444b751932118714e170'
        run: |
          set -euo pipefail
          zip="SDL3-devel-${SDL3_AAR_VERSION}-android.zip"
          aar="SDL3-${SDL3_AAR_VERSION}.aar"
          curl -fsSL --retry 3 -o "$zip" \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL3_AAR_VERSION}/${zip}"
          echo "${SDL3_ZIP_SHA256}  ${zip}" | sha256sum --check -
          mkdir -p app/libs
          unzip -o -j "$zip" "$aar" -d app/libs
          echo "${SDL3_AAR_SHA256}  app/libs/${aar}" | sha256sum --check -
          test -s "app/libs/${aar}"

      - name: Build APK
        shell: bash
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AngelSound-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error