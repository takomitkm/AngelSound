plugins {
    id 'com.android.application'
}

android {
    namespace = "moe.aimo.angelsound"
    compileSdk 35
    ndkVersion = "28.2.13676358"

    defaultConfig {
        applicationId "moe.aimo.angelsound"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "0.3.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-21",
                          "-DANDROID_STL=c++_static",
                          "-DANGELSOUND_USE_SYSTEM_SDL3=OFF",
                          "-DANGELSOUND_BUILD_TESTS=OFF"
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    lint {
        abortOnError = false
    }
}

dependencies {
}