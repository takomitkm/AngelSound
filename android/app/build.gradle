plugins {
    id 'com.android.application'
}

android {
    namespace = "moe.aimo.angelsound"
    compileSdk 35
    ndkVersion = "28.2.13676358"

    buildFeatures {
        prefab true
    }

    defaultConfig {
        applicationId "moe.aimo.angelsound"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "0.3.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-21",
                          "-DANDROID_STL=c++_static",
                          "-DANGELSOUND_USE_SYSTEM_SDL3=ON",
                          "-DANGELSOUND_BUILD_TESTS=OFF"
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    // SDL3 AAR is downloaded by CI into libs/ from the official 3.4.20
    // release; it supplies both org.libsdl.app.* and the Prefab native lib.
    implementation files('libs/SDL3-3.4.20.aar')
    // Activity Result API: SAF results survive activity recreation and are
    // delivered through a lifecycle-bound launcher instead of
    // onActivityResult (which some ROMs lose when they destroy the activity).
    implementation('androidx.activity:activity:1.9.3') {
        // Its transitive Kotlin stdlib conflicts with the older
        // kotlin-stdlib-jdk8 pulled in by other AndroidX modules.
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    }
}
